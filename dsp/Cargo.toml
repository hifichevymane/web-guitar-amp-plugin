[package]
name = "amp-dsp"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["dep:wasm-bindgen"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
hound = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
